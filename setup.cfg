[metadata]
name = la-dev-codex-plugins
version = 0.1.5
description = Language-agnostic development Codex plugins.
long_description = file: README.md
long_description_content_type = text/markdown
author = pallgeuer
url = https://github.com/pallgeuer/la-dev-codex-plugins
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    codex-perform = la_dev_codex_plugins.toolkit_perform_cli:main

name: Checks

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - name: Run pre-commit hooks
        run: uvx --python 3.10 --from pre-commit==4.6.0 pre-commit run --all-files --hook-stage manual

  ubuntu-18-04:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Python 3.6 smoke checks on Ubuntu 18.04
        run: |
          docker run --rm \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            ubuntu:18.04 \
            bash -c "apt-get update && apt-get install --yes git python3 && python3 tests/supported_platform_smoke.py"

  select_oldest_macos:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select oldest non-deprecated macOS Intel runner
        id: select
        shell: bash
        run: |
          set -o pipefail
          runner="$(
            curl -fsSL --retry 3 https://raw.githubusercontent.com/actions/runner-images/main/README.md |
              python3 scripts/select_oldest_macos_runner.py
          )"
          printf 'runner=%s\n' "$runner" >> "$GITHUB_OUTPUT"

  macos_oldest:
    needs: select_oldest_macos
    runs-on: ${{ needs.select_oldest_macos.outputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Run supported-platform smoke checks
        run: python3 tests/supported_platform_smoke.py

  macos_latest:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up latest stable Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run supported-platform smoke checks
        run: python3 tests/supported_platform_smoke.py

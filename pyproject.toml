[build-system]
requires = [
    "setuptools<60; python_version < '3.7'",
    "setuptools>=61; python_version >= '3.7'",
    "wheel<0.38; python_version < '3.7'",
    "wheel; python_version >= '3.7'",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "guarded_cwd: Run the test in a read-only poisoned temporary working directory",
    "isolated_cwd: Run the test in a fresh writable temporary working directory",
]

[tool.ruff]
line-length = 200
target-version = "py38"
src = ["package_scripts", "plugins", "source_launcher", "src", "tests"]

[tool.ruff.lint]
select = [
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PTH",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["la_dev_codex_plugins", "toolkit_perform_runtime"]

[tool.ty.environment]
python-version = "3.8"
